<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไขโปรไฟล์ - Clean Trash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #1a4b5c; --secondary-color: #2e6f85; --bg-color: #e0f2f1; --text-color: #333; --danger-color: #c0392b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }

        .app-container {
            width: 100%; max-width: 550px; background-color: #ffffff; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; position: relative;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 0 C80 20, 100 50, 50 100 C0 50, 20 20, 50 0" fill="%23e0f2f1" opacity="0.4"/></svg>');
            background-repeat: no-repeat; background-position: bottom right; background-size: 200px;
        }

        .header { background-color: var(--primary-color); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .header .logo { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 500; }
        .logo-icon { background-color: #a3d9a5; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-color); }
        .back-btn { color: white; text-decoration: none; font-size: 1rem; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .back-btn:hover { color: #a3d9a5; }

        .main-content { padding: 30px; }
        .page-title { color: var(--primary-color); margin-bottom: 25px; font-size: 1.4rem; text-align: center; }

        /* การ์ดแยกส่วน */
        .profile-card {
            background-color: #f9fbfb; border: 1px solid #e0e0e0; border-radius: 10px;
            padding: 20px; margin-bottom: 20px;
        }
        .card-title {
            font-size: 1.1rem; color: var(--primary-color); font-weight: 500;
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
            border-bottom: 2px solid #eee; padding-bottom: 10px;
        }

        /* ส่วนแสดงข้อมูลปัจจุบัน (Read-only) */
        .info-display {
            background-color: #fff; border: 1px solid #eee; border-radius: 8px;
            padding: 12px 15px; margin-bottom: 5px; font-size: 1rem; color: var(--text-color);
            display: flex; align-items: center; gap: 10px;
        }
        .info-display i { color: var(--secondary-color); width: 20px; text-align: center; }
        .info-label { font-size: 0.85rem; color: #666; margin-bottom: 5px; display: block; }

        /* รูปโปรไฟล์ */
        .avatar-section { display: flex; flex-direction: column; align-items: center; }
        .avatar-container {
            width: 120px; height: 120px; border-radius: 50%; background-color: #eee;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            border: 4px solid var(--primary-color); position: relative; cursor: pointer; transition: 0.3s;
        }
        .avatar-container:hover { opacity: 0.8; }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-container i { font-size: 3rem; color: #aaa; }
        .edit-icon {
            position: absolute; bottom: 0; right: 0; background-color: var(--primary-color);
            color: white; width: 35px; height: 35px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; border: 2px solid #fff; font-size: 0.9rem;
        }
        .avatar-container input[type="file"] { display: none; }

        /* ฟอร์ม */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 0.95rem; color: var(--text-color); font-weight: 500; }
        input[type="text"], input[type="email"] {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
            font-family: 'Kanit', sans-serif; font-size: 1rem; transition: 0.3s; background-color: #fff;
        }
        input:focus { border-color: var(--primary-color); outline: none; }

        /* ปุ่ม */
        button.btn {
            padding: 10px 20px; border: none; border-radius: 8px; font-family: 'Kanit', sans-serif;
            font-size: 1rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px;
            justify-content: center;
        }
        button.btn-primary { background-color: var(--primary-color); color: white; }
        button.btn-primary:hover { background-color: var(--secondary-color); }
        button.btn-outline { background-color: transparent; border: 2px solid var(--primary-color); color: var(--primary-color); }
        button.btn-outline:hover { background-color: var(--primary-color); color: white; }
        button.btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .btn-group button { flex: 1; min-width: 120px; }

        /* ข้อความแจ้งเตือน */
        .msg-box { margin-top: 10px; font-size: 0.9rem; min-height: 20px; font-weight: 500; }
        .msg-success { color: #27ae60; }
        .msg-error { color: var(--danger-color); }
        .msg-info { color: #2980b9; }

        .footer { background-color: var(--primary-color); color: white; text-align: center; padding: 15px; font-size: 0.8rem; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon"><i class="fa-solid fa-trash-can"></i></div>
                Clean Trash
            </div>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</a>
        </header>

        <main class="main-content">
            <h2 class="page-title"><i class="fa-solid fa-user-pen"></i> ตั้งค่าโปรไฟล์</h2>

            <!-- ==============================================
                 ส่วนที่ 1: แสดงข้อมูลปัจจุบัน (Read-Only)
                 ============================================== -->
            <div class="profile-card">
                <div class="card-title"><i class="fa-solid fa-id-card"></i> ข้อมูลปัจจุบันของคุณ</div>
                
                <span class="info-label">ชื่อที่แสดง</span>
                <div class="info-display">
                    <i class="fa-solid fa-user"></i>
                    <span id="displayFullName">-</span>
                </div>

                <span class="info-label" style="margin-top: 15px;">อีเมลที่ใช้ล็อกอิน</span>
                <div class="info-display">
                    <i class="fa-solid fa-envelope"></i>
                    <span id="displayEmail">-</span>
                </div>
            </div>

            <!-- ==============================================
                 ส่วนที่ 2: อัปโหลดรูปโปรไฟล์
                 ============================================== -->
            <div class="profile-card">
                <div class="card-title"><i class="fa-solid fa-image"></i> รูปโปรไฟล์</div>
                <div class="avatar-section">
                    <div class="avatar-container" id="avatarContainer">
                        <img id="avatarImage" src="" alt="Profile" style="display: none;">
                        <i class="fa-solid fa-user" id="defaultAvatarIcon"></i>
                        <div class="edit-icon"><i class="fa-solid fa-camera"></i></div>
                        <input type="file" id="avatarInput" accept="image/*">
                    </div>
                    <div class="msg-box" id="avatarMsg"></div>
                    <button class="btn btn-outline" id="uploadAvatarBtn" style="margin-top: 10px; display: none;">
                        <i class="fa-solid fa-upload"></i> อัปโหลดรูปนี้
                    </button>
                </div>
            </div>

            <!-- ==============================================
                 ส่วนที่ 3: เปลี่ยนชื่อที่แสดง
                 ============================================== -->
            <div class="profile-card">
                <div class="card-title"><i class="fa-solid fa-signature"></i> เปลี่ยนชื่อที่แสดง</div>
                <div class="form-group">
                    <label>ชื่อใหม่ที่ต้องการแสดง</label>
                    <input type="text" id="newFullNameInput" placeholder="กรอกชื่อใหม่">
                </div>
                <div class="msg-box" id="nameMsg"></div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="saveNameBtn">
                        <i class="fa-solid fa-floppy-disk"></i> บันทึกชื่อใหม่
                    </button>
                </div>
            </div>

            <!-- ==============================================
                 ส่วนที่ 4: เปลี่ยนอีเมล
                 ============================================== -->
            <div class="profile-card">
                <div class="card-title"><i class="fa-solid fa-envelope"></i> เปลี่ยนอีเมล</div>
                <div class="form-group">
                    <label>อีเมลใหม่</label>
                    <input type="email" id="newEmailInput" placeholder="กรอกอีเมลใหม่">
                </div>
                <div class="msg-box" id="emailMsg"></div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="confirmEmailBtn">
                        <i class="fa-solid fa-paper-plane"></i> ยืนยันเปลี่ยนอีเมล
                    </button>
                </div>
                <p style="font-size: 0.8rem; color: #666; margin-top: 10px;">
                    * ระบบจะส่งลิงก์ยืนยันไปยังอีเมลใหม่ กรุณาตรวจสอบกล่องจดหมาย
                </p>
            </div>

        </main>

        <footer class="footer">
            <p>ส่งเสริมการจัดการขยะอย่างยั่งยืนเพื่อสิ่งแวดล้อมที่ดีขึ้น</p>
            <p>&copy; 2025 Clean Trash. สงวนลิขสิทธิ์</p>
        </footer>
    </div>

    <!-- โหลด Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://uzkilomxmgerbcaqwohr.supabase.co';
        const supabaseKey = 'sb_publishable_04y-wjh0ohG-yMN6mOWaWw_MUvUZWRa';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let selectedAvatarFile = null;

        // ฟังก์ชันช่วยแสดงข้อความ
        function showMsg(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = `msg-box msg-${type}`;
        }

        // ==========================================
        // 1. โหลดข้อมูลเริ่มต้น
        // ==========================================
        async function loadProfile() {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) {
                window.location.href = 'auth.html';
                return;
            }
            currentUser = user;

            // แสดงอีเมลในส่วน Read-only
            document.getElementById('displayEmail').textContent = user.email;

            // ดึงข้อมูลจากตาราง profiles
            const { data: profile } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profile) {
                // แสดงชื่อในส่วน Read-only
                document.getElementById('displayFullName').textContent = profile.full_name || 'ยังไม่ได้ตั้งชื่อ';
                
                if (profile.avatar_url) {
                    document.getElementById('avatarImage').src = profile.avatar_url;
                    document.getElementById('avatarImage').style.display = 'block';
                    document.getElementById('defaultAvatarIcon').style.display = 'none';
                }
            } else {
                document.getElementById('displayFullName').textContent = 'ยังไม่ได้ตั้งชื่อ';
            }
        }

        // ==========================================
        // 2. จัดการรูปโปรไฟล์ (Avatar Upload)
        // ==========================================
        document.getElementById('avatarContainer').addEventListener('click', () => {
            document.getElementById('avatarInput').click();
        });

        document.getElementById('avatarInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedAvatarFile = file;
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('avatarImage').src = event.target.result;
                    document.getElementById('avatarImage').style.display = 'block';
                    document.getElementById('defaultAvatarIcon').style.display = 'none';
                };
                reader.readAsDataURL(file);
                // แสดงปุ่มอัปโหลดเมื่อเลือกรูปแล้ว
                document.getElementById('uploadAvatarBtn').style.display = 'flex';
            }
        });

        document.getElementById('uploadAvatarBtn').addEventListener('click', async () => {
            if (!selectedAvatarFile || !currentUser) return;
            const btn = document.getElementById('uploadAvatarBtn');
            btn.disabled = true;
            showMsg('avatarMsg', 'กำลังอัปโหลดรูป...', 'info');

            try {
                const fileExt = selectedAvatarFile.name.split('.').pop();
                // ตั้งชื่อไฟล์ด้วย user.id เพื่อให้ง่ายต่อการจัดการ (จะทับของเดิมเสมอถ้า upsert: true)
                const fileName = `${currentUser.id}.${fileExt}`;
                
                // อัปโหลดไฟล์ขึ้น Storage
                const { error: uploadError } = await supabase.storage
                    .from('avatars')
                    .upload(fileName, selectedAvatarFile, { upsert: true });
                
                if (uploadError) throw uploadError;

                // ดึง Public URL ของรูป
                const { data: urlData } = supabase.storage.from('avatars').getPublicUrl(fileName);
                const avatarUrl = urlData.publicUrl + '?t=' + Date.now(); // ใส่ timestamp กันแคช

                // บันทึก URL ลงตาราง profiles (เฉพาะของ User คนนี้)
                const { error: dbError } = await supabase
                    .from('profiles')
                    .upsert({ id: currentUser.id, avatar_url: avatarUrl });
                
                if (dbError) throw dbError;

                showMsg('avatarMsg', 'อัปโหลดรูปโปรไฟล์สำเร็จ! 🎉', 'success');
                
                // อัปเดตรูปที่แสดงในส่วน Read-only (ถ้ามี)
                document.getElementById('avatarImage').src = avatarUrl;
                btn.style.display = 'none';
                selectedAvatarFile = null;

            } catch (error) {
                showMsg('avatarMsg', `เกิดข้อผิดพลาด: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        // ==========================================
        // 3. จัดการเปลี่ยนชื่อ (แยกส่วน)
        // ==========================================
        document.getElementById('saveNameBtn').addEventListener('click', async () => {
            if (!currentUser) return;
            const newFullName = document.getElementById('newFullNameInput').value.trim();
            if (!newFullName) {
                showMsg('nameMsg', 'กรุณากรอกชื่อใหม่', 'error');
                return;
            }

            const btn = document.getElementById('saveNameBtn');
            btn.disabled = true;
            showMsg('nameMsg', 'กำลังบันทึก...', 'info');

            try {
                const { error } = await supabase
                    .from('profiles')
                    .upsert({ id: currentUser.id, full_name: newFullName });
                
                if (error) throw error;
                
                showMsg('nameMsg', 'บันทึกชื่อใหม่สำเร็จ! 🎉', 'success');
                document.getElementById('displayFullName').textContent = newFullName; // อัปเดตส่วน Read-only
                document.getElementById('newFullNameInput').value = ''; // ล้างช่องกรอก
                localStorage.setItem('user_full_name', newFullName);

            } catch (error) {
                showMsg('nameMsg', `เกิดข้อผิดพลาด: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        // ==========================================
        // 4. จัดการเปลี่ยนอีเมล (แยกส่วน)
        // ==========================================
        document.getElementById('confirmEmailBtn').addEventListener('click', async () => {
            const newEmail = document.getElementById('newEmailInput').value.trim();
            if (!newEmail) {
                showMsg('emailMsg', 'กรุณากรอกอีเมลใหม่', 'error');
                return;
            }

            const btn = document.getElementById('confirmEmailBtn');
            btn.disabled = true;
            showMsg('emailMsg', 'กำลังส่งคำขอยืนยัน...', 'info');

            try {
                // ใช้ฟังก์ชัน updateUser ของ Supabase ในการขอเปลี่ยนอีเมล
                const { error } = await supabase.auth.updateUser({ email: newEmail });
                if (error) throw error;

                showMsg('emailMsg', 'ส่งลิงก์ยืนยันไปยังอีเมลใหม่แล้ว กรุณาเช็กอีเมลครับ', 'success');
                document.getElementById('newEmailInput').value = '';

            } catch (error) {
                showMsg('emailMsg', `เกิดข้อผิดพลาด: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        // เรียกใช้ฟังก์ชันเมื่อโหลดหน้า
        loadProfile();
    </script>
</body>
</html>
