<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register/Login - Clean Trash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #1a4b5c;
            --secondary-color: #2e6f85;
            --bg-color: #e0f2f1;
            --text-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 450px; /* เล็กลงหน่อยเพราะเป็นหน้า Login */
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 0 C80 20, 100 50, 50 100 C0 50, 20 20, 50 0" fill="%23e0f2f1" opacity="0.4"/></svg>');
            background-repeat: no-repeat;
            background-position: bottom right;
            background-size: 200px;
        }

        .header {
            background-color: var(--primary-color);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 500;
        }
        
        .logo-icon {
            background-color: #a3d9a5;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: 0.2s;
        }
        .back-btn:hover { color: #a3d9a5; }

        .main-content {
            padding: 30px;
        }

        /* Tabs สลับ Login/Register */
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 1rem;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
            color: #888;
            font-weight: 500;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }

        /* ฟอร์ม */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Kanit', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
        }
        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button.submit-btn:hover { background-color: var(--secondary-color); }
        button.submit-btn:disabled { background-color: #999; cursor: not-allowed; }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .hidden { display: none; }

        .footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon"><i class="fa-solid fa-trash-can"></i></div>
                Clean Trash
            </div>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> กลับ</a>
        </header>

        <main class="main-content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">เข้าสู่ระบบ</button>
                <button class="tab-btn" onclick="switchTab('register')">สมัครสมาชิก</button>
            </div>

            <!-- ฟอร์ม Login -->
            <form id="loginForm">
                <div class="form-group">
                    <label>อีเมล</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">เข้าสู่ระบบ</button>
            </form>

            <!-- ฟอร์ม Register -->
            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label>อีเมล</label>
                    <input type="email" id="regEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
                    <input type="password" id="regPassword" placeholder="••••••••" minlength="6" required>
                </div>
                <button type="submit" class="submit-btn" id="regBtn">สมัครสมาชิก</button>
            </form>

            <div id="message" class="message"></div>
        </main>

        <footer class="footer">
            <p>&copy; 2025 Clean Trash. สงวนลิขสิทธิ์</p>
        </footer>
    </div>

    <!-- โหลด Supabase -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->
    <script>
        // const supabaseUrl = 'https://uzkilomxmgerbcaqwohr.supabase.co';
        // const supabaseKey = 'sb_publishable_04y-wjh0ohG-yMN6mOWaWw_MUvUZWRa';
        // const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const messageDiv = document.getElementById('message');

        // ฟังก์ชันสลับ Tab
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            messageDiv.innerHTML = '';

            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginForm').classList.remove('hidden');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerForm').classList.remove('hidden');
            }
        }

        // จัดการฟอร์มสมัครสมาชิก
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const btn = document.getElementById('regBtn');

            btn.disabled = true;
            messageDiv.innerHTML = '<span style="color: blue;">กำลังสมัครสมาชิก...</span>';

            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) {
                messageDiv.innerHTML = `<span style="color: red;">เกิดข้อผิดพลาด: ${error.message}</span>`;
            } else {
                // ตรวจสอบว่าเปิดการยืนยันอีเมลไว้หรือไม่
                if (data.user && data.session) {
                    messageDiv.innerHTML = '<span style="color: green;">สมัครสมาชิกสำเร็จ! กำลังพาไปหน้าหลัก...</span>';
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    messageDiv.innerHTML = '<span style="color: green;">สมัครสำเร็จ! กรุณาเช็กอีเมลเพื่อยืนยันบัญชีครับ</span>';
                }
            }
            btn.disabled = false;
        });

        // จัดการฟอร์มเข้าสู่ระบบ
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            messageDiv.innerHTML = '<span style="color: blue;">กำลังเข้าสู่ระบบ...</span>';

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                messageDiv.innerHTML = `<span style="color: red;">เข้าสู่ระบบไม่สำเร็จ: ${error.message}</span>`;
            } else {
                messageDiv.innerHTML = '<span style="color: green;">เข้าสู่ระบบสำเร็จ! กำลังพาไปหน้าหลัก...</span>';
                setTimeout(() => window.location.href = 'index.html', 1000);
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
