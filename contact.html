<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดต่อเรา - Clean Trash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #1a4b5c; --secondary-color: #2e6f85; --bg-color: #e0f2f1; --text-color: #333; --danger-color: #c0392b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }

        .app-container {
            width: 100%; max-width: 800px; background-color: #ffffff; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; position: relative;
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 0 C80 20, 100 50, 50 100 C0 50, 20 20, 50 0" fill="%23e0f2f1" opacity="0.4"/></svg>');
            background-repeat: no-repeat; background-position: bottom right; background-size: 300px;
        }

        .header { background-color: var(--primary-color); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .header .logo { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 500; }
        .logo-icon { background-color: #a3d9a5; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-color); }
        .back-btn { color: white; text-decoration: none; font-size: 1rem; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .back-btn:hover { color: #a3d9a5; }

        .main-content { padding: 30px; }
        .page-title { color: var(--primary-color); margin-bottom: 25px; font-size: 1.4rem; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; }

        /* ส่วนติดต่อ-info */
        .contact-info-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px;
        }
        .info-card {
            background: #f9fbfb; border: 1px solid #eee; border-radius: 10px; padding: 20px;
            text-align: center; transition: transform 0.2s;
        }
        .info-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .info-icon {
            width: 50px; height: 50px; border-radius: 50%; background-color: var(--primary-color);
            color: white; display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; margin: 0 auto 10px auto;
        }
        .info-card h4 { color: var(--primary-color); margin-bottom: 5px; }
        .info-card p { font-size: 0.9rem; color: #666; }

        /* ฟอร์ม */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 0.95rem; color: var(--text-color); font-weight: 500; }
        input, textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
            font-family: 'Kanit', sans-serif; font-size: 1rem; transition: 0.3s; background-color: #fff;
        }
        input:focus, textarea:focus { border-color: var(--primary-color); outline: none; }
        textarea { resize: vertical; min-height: 120px; }

        button.submit-btn {
            width: 100%; padding: 14px; background-color: var(--primary-color); color: white;
            border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; margin-top: 10px;
            transition: 0.3s; font-weight: 500; font-family: 'Kanit', sans-serif;
        }
        button.submit-btn:hover { background-color: var(--secondary-color); }
        button.submit-btn:disabled { background-color: #999; cursor: not-allowed; }

        .message { margin-top: 20px; text-align: center; font-size: 1rem; min-height: 24px; font-weight: 500; }

        .footer { background-color: var(--primary-color); color: white; text-align: center; padding: 15px; font-size: 0.8rem; margin-top: 30px; }

        /* =========================================
           ปุ่มแชทลอย (Floating Chat Button)
           ========================================= */
        .chat-toggle-btn {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; border-radius: 50%;
            background-color: var(--primary-color); color: white;
            border: none; cursor: pointer; font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 9999; /* ให้อยู่บนสุดเสมอ */
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s, background-color 0.2s;
        }
        .chat-toggle-btn:hover { transform: scale(1.1); background-color: var(--secondary-color); }
        .chat-toggle-btn.active { background-color: var(--danger-color); }

        /* =========================================
           หน้าต่างแชท (Chat Window)
           ========================================= */
        .chat-window {
            position: fixed; bottom: 100px; right: 30px;
            width: 320px; height: 450px;
            background-color: #ffffff; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 9998;
            border: 2px solid var(--primary-color);
            display: none; /* ซ่อนไว้ก่อน */
            flex-direction: column; overflow: hidden;
        }
        
        /* เมื่อกดแล้วให้แสดงผล */
        .chat-window.show { 
            display: flex !important; 
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-window-header {
            background-color: var(--primary-color); color: white;
            padding: 15px; font-size: 1rem; font-weight: 500;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-window-header .close-chat {
            background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer;
        }

        .chat-box {
            flex-grow: 1; padding: 15px; background-color: #f9fbfb;
            display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem;
            overflow-y: auto;
        }

        .chat-message { display: flex; flex-direction: column; max-width: 80%; }
        .chat-message.user { align-self: flex-end; align-items: flex-end; }
        .chat-message.admin { align-self: flex-start; align-items: flex-start; }
        
        .chat-bubble {
            padding: 8px 12px; border-radius: 12px; line-height: 1.4; word-break: break-word;
        }
        .chat-message.user .chat-bubble { background-color: var(--primary-color); color: white; border-bottom-right-radius: 2px; }
        .chat-message.admin .chat-bubble { background-color: #e0e0e0; color: #333; border-bottom-left-radius: 2px; }
        
        .chat-sender-name { font-size: 0.75rem; color: #888; margin-bottom: 3px; }

        .chat-input-area {
            padding: 10px; background-color: #fff; border-top: 1px solid #eee;
            display: flex; gap: 8px;
        }
        .chat-input-area input {
            flex-grow: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #ccc;
            font-size: 0.9rem; font-family: 'Kanit', sans-serif;
        }
        .chat-input-area input:focus { border-color: var(--primary-color); }
        .chat-input-area button {
            width: 40px; height: 40px; border-radius: 50%; background-color: var(--primary-color);
            color: white; border: none; cursor: pointer; font-size: 1rem; transition: 0.3s;
            display: flex; justify-content: center; align-items: center;
        }
        .chat-input-area button:hover { background-color: var(--secondary-color); }
        .chat-input-area button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon"><i class="fa-solid fa-trash-can"></i></div>
                Clean Trash
            </div>
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</a>
        </header>

        <main class="main-content">
            <h2 class="page-title"><i class="fa-solid fa-phone"></i> ติดต่อเรา</h2>

            <!-- ส่วนข้อมูลการติดต่อ -->
            <div class="contact-info-grid">
                <div class="info-card">
                    <div class="info-icon"><i class="fa-solid fa-phone"></i></div>
                    <h4>เบอร์โทรศัพท์</h4>
                    <p>084-052-8607</p>
                </div>
                <div class="info-card">
                    <div class="info-icon"><i class="fa-solid fa-envelope"></i></div>
                    <h4>อีเมล</h4>
                    <p>contact@cleantrash.online</p>
                </div>
                <div class="info-card">
                    <div class="info-icon"><i class="fa-solid fa-location-dot"></i></div>
                    <h4>ที่อยู่</h4>
                    <p>สระบุรี ประเทศไทย</p>
                </div>
            </div>

            <!-- ฟอร์มติดต่อ -->
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">ชื่อของคุณ</label>
                    <input type="text" id="name" placeholder="กรอกชื่อของคุณ" required>
                </div>

                <div class="form-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="messageText">ข้อความ</label>
                    <textarea id="messageText" placeholder="พิมพ์ข้อความที่ต้องการติดต่อ..." required></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fa-solid fa-paper-plane"></i> ส่งข้อความ
                </button>
            </form>

            <div id="message" class="message"></div>
        </main>

        <footer class="footer">
            <p>ส่งเสริมการจัดการขยะอย่างยั่งยืนเพื่อสิ่งแวดล้อมที่ดีขึ้น</p>
            <p>&copy; 2025 Clean Trash. สงวนลิขสิทธิ์</p>
        </footer>
    </div>

    <!-- =========================================
         ปุ่มแชทลอย และ หน้าต่างแชท
         ========================================= -->
    <button class="chat-toggle-btn" id="chatToggleBtn">
        <i class="fa-solid fa-comment-dots"></i>
    </button>

    <div class="chat-window" id="chatWindow">
        <div class="chat-window-header">
            <span><i class="fa-solid fa-headset"></i> แชทกับแอดมิน</span>
            <button class="close-chat" id="closeChatBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="chat-box" id="chatBox">
            <!-- ข้อความจำลอง (โชว์ไว้ให้เห็นว่ากล่องทำงาน) -->
            <div class="chat-message admin">
                <div class="chat-sender-name">แอดมิน</div>
                <div class="chat-bubble">สวัสดีครับ! นี่คือข้อความจำลอง</div>
            </div>
            <div class="chat-message admin">
                <div class="chat-sender-name">แอดมิน</div>
                <div class="chat-bubble">เป็นไงบ้างครับ</div>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="พิมพ์ข้อความ..." autocomplete="off">
            <button id="chatSendBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- โหลด Supabase (คอมเมนต์ไว้ก่อน) -->
    <!-- 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    -->
    
    <script>
        // =========================================
        // 1. ฟอร์มติดต่อ (คอมเมนต์การเชื่อมต่อ DB ไว้)
        // =========================================
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // --- ส่วนเชื่อมต่อ DB (คอมเมนต์ไว้) ---
            /*
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('messageText').value.trim();
            submitBtn.disabled = true;
            messageDiv.innerHTML = '<span style="color: blue;">กำลังส่งข้อความ...</span>';
            try {
                const { error } = await supabase.from('contacts').insert([{ name, email, message }]);
                if (error && error.code !== '42P01') throw error;
                messageDiv.innerHTML = '<span style="color: green;">ส่งข้อความสำเร็จ! 🎉</span>';
                document.getElementById('contactForm').reset();
            } catch (error) {
                messageDiv.innerHTML = `<span style="color: red;">เกิดข้อผิดพลาด: ${error.message}</span>`;
            } finally {
                submitBtn.disabled = false;
            }
            */
            
            // --- ส่วนจำลองการส่งข้อความ ---
            messageDiv.innerHTML = '<span style="color: green;">ส่งข้อความจำลองสำเร็จ! (ยังไม่ได้เชื่อมต่อ DB)</span>';
            document.getElementById('contactForm').reset();
        });

        // =========================================
        // 2. ระบบแชท (UI ทำงาน 100% ไม่มี DB)
        // =========================================
        const chatToggleBtn = document.getElementById('chatToggleBtn');
        const chatWindow = document.getElementById('chatWindow');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');

        // เปิด-ปิดหน้าต่างแชท
        chatToggleBtn.addEventListener('click', () => {
            chatWindow.classList.toggle('show');
            
            if (chatWindow.classList.contains('show')) {
                chatToggleBtn.classList.add('active');
                chatToggleBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                // เลื่อนลงล่างสุด
                chatBox.scrollTop = chatBox.scrollHeight;
            } else {
                chatToggleBtn.classList.remove('active');
                chatToggleBtn.innerHTML = '<i class="fa-solid fa-comment-dots"></i>';
            }
        });

        // ปุ่มปิด
        closeChatBtn.addEventListener('click', () => {
            chatWindow.classList.remove('show');
            chatToggleBtn.classList.remove('active');
            chatToggleBtn.innerHTML = '<i class="fa-solid fa-comment-dots"></i>';
        });

        // ฟังก์ชันจำลองการส่งข้อความ (ไม่บันทึก DB)
        function sendMockMessage() {
            const content = chatInput.value.trim();
            if (!content) return;

            // ล้างช่องพิมพ์
            chatInput.value = '';

            // สร้างข้อความของผู้ใช้
            const userRow = document.createElement('div');
            userRow.className = 'chat-message user';
            userRow.innerHTML = `
                <div class="chat-sender-name">คุณ</div>
                <div class="chat-bubble">${content}</div>
            `;
            chatBox.appendChild(userRow);
            chatBox.scrollTop = chatBox.scrollHeight;

            // จำลองการตอบกลับของแอดมิน (หน่วงเวลา 1 วินาที)
            setTimeout(() => {
                const adminRow = document.createElement('div');
                adminRow.className = 'chat-message admin';
                adminRow.innerHTML = `
                    <div class="chat-sender-name">แอดมิน</div>
                    <div class="chat-bubble">ได้รับข้อความแล้วครับ (ข้อความจำลอง) 😊</div>
                `;
                chatBox.appendChild(adminRow);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        // ผูกเหตุการณ์
        chatSendBtn.addEventListener('click', sendMockMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMockMessage();
        });
    </script>
</body>
</html>
